<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賞状ダウンロード</title>
<style>
  :root{
    --paper:#faf7f0; --ink:#211c14; --gold:#a9822f; --gold-soft:#e7dcc0; --line:#ddd3ba;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS Mincho","Noto Serif JP",serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:40px 22px 64px; }
  header{ text-align:center; margin-bottom:26px; }
  header h1{ font-size:24px; font-weight:600; letter-spacing:.06em; margin:0 0 8px; }
  header p{ margin:0; font-size:13px; color:#6b6252; }
  .searchbox{
    width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--line);
    border-radius:2px; background:#fff; font-family:inherit; color:var(--ink);
  }
  .searchbox:focus{ outline:none; border-color:var(--gold); }
  .results{ margin-top:12px; border:1px solid var(--line); border-radius:2px; background:#fff; overflow:hidden; }
  .result-item{
    padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:15px;
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  }
  .result-item:last-child{ border-bottom:none; }
  .result-item:hover, .result-item.active{ background:#fbf6e9; }
  .result-item .sub{ font-size:12px; color:#8a8067; white-space:nowrap; }
  .empty-msg{ padding:16px 14px; font-size:13.5px; color:#8a8067; }
  .stagewrap{ display:flex; flex-direction:column; align-items:center; margin-top:26px; }
  .stage{
    width:100%; border:1px solid var(--line); box-shadow:0 10px 30px rgba(30,24,10,.09); background:#fff;
  }
  .stage canvas{ width:100%; height:auto; display:block; }
  .hidden{ display:none !important; }
  button{
    font-family:inherit; font-size:14px; padding:12px 16px; border-radius:2px;
    border:1px solid var(--ink); background:var(--ink); color:#fdfcf9; cursor:pointer;
    letter-spacing:.03em; width:100%; margin-top:16px;
  }
  button:hover{ opacity:.88; }
  .footer-note{
    margin-top:30px; font-size:11.5px; color:#9a9078; text-align:center; line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>賞状ダウンロード</h1>
    <p>ご自分のお名前を入力して検索してください</p>
  </header>

  <input type="text" class="searchbox" id="searchInput" placeholder="お名前を入力（例: 宮城太郎）" autocomplete="off">
  <div class="results hidden" id="resultsBox"></div>

  <div class="stagewrap hidden" id="stageWrap">
    <div class="stage"><canvas id="canvas" width="1240" height="1753"></canvas></div>
    <button id="btnPdf">この賞状をPDFでダウンロード</button>
  </div>

  <div class="footer-note">全 32 件の名簿から検索しています</div>
</div>

const ORIG_W = 1655;
const CLASS_BAND = {y0:685, y1:743, xRight:1355, size:60};
const NAME_BAND  = {y0:797, y1:894, xRight:1336, size:103};
const SAFE_LEFT_X = 300;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const searchInput = document.getElementById('searchInput');
const resultsBox = document.getElementById('resultsBox');
const stageWrap = document.getElementById('stageWrap');
const btnPdf = document.getElementById('btnPdf');

let bgImage = null;           // 通常の台紙(ノーギア一般)
const bgVariants = {};        // 見出しを差し替えた台紙
let selected = null;

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('image load failed'));
    img.src = src;
  });
}

function measureTracked(ctx, text, fontSize, tracking){
  ctx.font = `700 ${fontSize}px "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS Mincho","Noto Serif JP",serif`;
  const gap = fontSize * tracking;
  const widths = [...text].map(ch => ctx.measureText(ch).width);
  const totalW = widths.reduce((a,b)=>a+b,0) + gap*(text.length-1);
  return { widths, gap, totalW };
}
function drawTrackedText(ctx, text, rightX, yCenter, fontSize, tracking, maxWidth){
  let { widths, gap, totalW } = measureTracked(ctx, text, fontSize, tracking);
  if(maxWidth && totalW > maxWidth){
    const shrink = maxWidth / totalW;
    fontSize = fontSize * shrink;
    ({ widths, gap, totalW } = measureTracked(ctx, text, fontSize, tracking));
  }
  let x = rightX - totalW;
  const y = yCenter + fontSize*0.34;
  [...text].forEach((ch,i)=>{ ctx.fillText(ch, x, y); x += widths[i] + gap; });
}
function render(data){
  const bg = (data.category && bgVariants[data.category]) || bgImage;
  if(!bg) return;
  const scale = canvas.width / ORIG_W;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#111';
  // 例: 男子83kg級　第1位　記録600kg / 順位が空欄なら 男子59kg級　記録70kg
  const classLine = [data.weight_class, data.place, `記録${data.record||''}`].filter(s => s).join('\u3000');
  const classYCenter = (CLASS_BAND.y0+CLASS_BAND.y1)/2*scale;
  const classMaxWidth = (CLASS_BAND.xRight - SAFE_LEFT_X) * scale;
  drawTrackedText(ctx, classLine, CLASS_BAND.xRight*scale, classYCenter, CLASS_BAND.size*scale, 0.20, classMaxWidth);
  const nameLine = `${data.name||''}殿`;
  const nameYCenter = (NAME_BAND.y0+NAME_BAND.y1)/2*scale;
  const nameMaxWidth = (NAME_BAND.xRight - SAFE_LEFT_X) * scale;
  drawTrackedText(ctx, nameLine, NAME_BAND.xRight*scale, nameYCenter, NAME_BAND.size*scale, 0.16, nameMaxWidth);
}

/* ===== PDF生成（依存ライブラリなし） ===== */
function strToBytes(str){ const a=new Uint8Array(str.length); for(let i=0;i<str.length;i++) a[i]=str.charCodeAt(i)&0xff; return a; }
function concatBytes(chunks){ let t=0; chunks.forEach(c=>t+=c.length); const o=new Uint8Array(t); let off=0; chunks.forEach(c=>{o.set(c,off); off+=c.length;}); return o; }
function padNum(n,w){ return String(n).padStart(w,'0'); }
function buildPdfFromJpegs(pages){
  const chunks=[]; let offset=0; const objOffsets={};
  function push(b){ const bytes=(typeof b==='string')?strToBytes(b):b; chunks.push(bytes); offset+=bytes.length; }
  function beginObj(n){ objOffsets[n]=offset; push(`${n} 0 obj\n`); }
  function endObj(){ push('endobj\n'); }
  push('%PDF-1.4\n');
  const N=pages.length, catalogNum=1, pagesNum=2;
  const pageNums=[]; for(let i=0;i<N;i++) pageNums.push(3+i*3);
  beginObj(catalogNum); push(`<< /Type /Catalog /Pages ${pagesNum} 0 R >>\n`); endObj();
  beginObj(pagesNum); push(`<< /Type /Pages /Kids [${pageNums.map(n=>n+' 0 R').join(' ')}] /Count ${N} >>\n`); endObj();
  for(let i=0;i<N;i++){
    const pageNum=3+i*3, imgNum=4+i*3, contNum=5+i*3;
    const { jpeg, w, h } = pages[i];
    beginObj(pageNum);
    push(`<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${imgNum} 0 R >> >> /Contents ${contNum} 0 R >>\n`);
    endObj();
    beginObj(imgNum);
    push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    push(jpeg); push('\nendstream\n'); endObj();
    const content = `q\n${w} 0 0 ${h} 0 0 cm\n/Im0 Do\nQ`;
    beginObj(contNum);
    push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\n`);
    endObj();
  }
  const totalObjs=2+3*N, xrefStart=offset;
  push(`xref\n0 ${totalObjs+1}\n`); push('0000000000 65535 f \n');
  for(let num=1;num<=totalObjs;num++) push(`${padNum(objOffsets[num],10)} 00000 n \n`);
  push(`trailer\n<< /Size ${totalObjs+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  return concatBytes(chunks);
}
function dataURLtoUint8Array(dataUrl){
  const b64 = dataUrl.split(',')[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ===== 検索UI ===== */
function showResults(query){
  const q = query.trim();
  if(!q){ resultsBox.classList.add('hidden'); resultsBox.innerHTML=''; return; }
  const matches = ROSTER.filter(r => (r.name||'').includes(q));
  resultsBox.classList.remove('hidden');
  if(matches.length === 0){
    resultsBox.innerHTML = '<div class="empty-msg">一致するお名前が見つかりませんでした</div>';
    return;
  }
  const shown = matches.slice(0, 30);
  resultsBox.innerHTML = shown.map((r,i)=>
    `<div class="result-item" data-idx="${ROSTER.indexOf(r)}"><span>${r.name||''}</span><span class="sub">${[r.category, r.weight_class, r.place].filter(s => s).join(' ')}</span></div>`
  ).join('') + (matches.length>30 ? `<div class="empty-msg">他 ${matches.length-30} 件…もう少し詳しく入力してください</div>` : '');
  Array.from(resultsBox.querySelectorAll('.result-item')).forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-idx'),10);
      selectEntry(ROSTER[idx]);
    });
  });
}
function selectEntry(entry){
  selected = entry;
  searchInput.value = entry.name || '';
  resultsBox.classList.add('hidden');
  allLoaded.then(()=>{
    if(selected !== entry) return;     // 読み込み待ちの間に別の人が選ばれた場合は何もしない
    render(entry);
    stageWrap.classList.remove('hidden');
  });
}
searchInput.addEventListener('input', (e)=> showResults(e.target.value));

btnPdf.addEventListener('click', ()=>{
  if(!selected) return;
  try{
    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
    const jpeg = dataURLtoUint8Array(dataUrl);
    const pdfBytes = buildPdfFromJpegs([{ jpeg, w: canvas.width, h: canvas.height }]);
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    downloadBlob(blob, `${selected.name||'certificate'}_賞状.pdf`);
  }catch(e){
    alert('PDFの作成に失敗しました: ' + e.message);
  }
});

const baseLoad = loadImage(TEMPLATE_SRC).then(img=>{ bgImage = img; }).catch(()=>{
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin', '<div class="empty-msg">背景画像の読み込みに失敗しました</div>');
});
const variantLoads = Object.keys(BG_VARIANTS).map(cat =>
  loadImage(BG_VARIANTS[cat]).then(img=>{ bgVariants[cat] = img; }).catch(()=>{})
);
const allLoaded = Promise.all([baseLoad, ...variantLoads]);
</script>
